<style>
:root{--pitch:#0e6342;--deep:#083b2a;--lime:#d5ed72;--ink:#1a2a20;--muted:#68736b;--paper:#f4f1e8;--card:#fffdf7;--line:#d8d7cc;--gold:#d69f30}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}.top{height:66px;background:var(--deep);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1350px)/2));gap:15px}.brand{font-weight:800;font-size:18px;letter-spacing:1px}.brand small{display:block;font-size:9px;color:#afd0bd;letter-spacing:1.5px}.top button{border:1px solid #63927c;background:transparent;color:white;padding:7px 11px;border-radius:4px}.screen{display:none}.screen.active{display:block}.hero{padding:76px 8%;min-height:355px;background:linear-gradient(120deg,#0a402e,#16734c);color:white;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:480px;height:480px;border:1px solid #b9d866;right:-160px;top:-150px;border-radius:50%;box-shadow:0 0 0 55px #ffffff0e,0 0 0 110px #ffffff0a}.hero>*{position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--lime);font-weight:bold}.hero h1{font-size:42px;line-height:1.2;max-width:720px;margin:12px 0}.hero p{max-width:650px;color:#d3e5da}.setup{max-width:1030px;margin:-35px auto 48px;padding:0 20px;position:relative;z-index:2}.card{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px #12351b12}.form-card{padding:28px}.form-card h2{margin:0;font-size:22px}.hint{color:var(--muted);font-size:13px;margin:6px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.field label{font-size:12px;font-weight:bold;color:#405147;display:block;margin-bottom:5px}.field input,.field select{width:100%;height:42px;border:1px solid #bdc6be;border-radius:4px;background:white;padding:0 10px;color:var(--ink)}.span2{grid-column:span 2}.primary{background:var(--pitch);border:0;color:white;font-weight:bold;padding:11px 16px;border-radius:4px;margin-top:20px}.dashboard{max-width:1400px;margin:auto;padding:20px;display:grid;grid-template-columns:278px minmax(0,1fr) 285px;gap:18px;align-items:start}.profile{overflow:hidden}.profile-head{background:var(--deep);color:white;padding:20px}.club{font-size:11px;color:var(--lime);font-weight:bold;letter-spacing:1px}.pname{font-size:27px;font-weight:bold;margin:6px 0}.bio{font-size:12px;color:#c3d8cb}.ovr-row{display:flex;align-items:end;gap:9px;margin-top:18px}.ovr{font-size:58px;line-height:.9;color:var(--lime);font-weight:900}.ovr-label{font-size:11px;color:#c4d8cc;padding-bottom:4px}.profile-body{padding:17px}.value{border-bottom:1px solid var(--line);padding-bottom:13px;font-size:12px;color:var(--muted)}.value b{display:block;font-size:20px;color:var(--pitch)}.attr{margin:11px 0}.attr-title{display:flex;justify-content:space-between;font-size:12px}.bar{height:6px;border-radius:5px;background:#e7e7de;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pitch)}details{border-top:1px solid var(--line);margin-top:14px;padding-top:11px;font-size:12px}summary{font-weight:bold;cursor:pointer}.detail{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px;font-size:11px}.detail div{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:3px}.season-head{padding:20px 25px;background:var(--deep);color:white;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center}.season-head h2{font-size:20px;margin:3px 0}.season-head p{margin:0;color:#c5d9cc;font-size:12px}.tag{font-size:11px;border:1px solid #5e8b75;color:var(--lime);border-radius:15px;padding:5px 8px}.story{padding:30px;min-height:420px}.chapter{font-size:11px;color:var(--pitch);font-weight:bold;letter-spacing:1px}.story h3{font-size:25px;line-height:1.3;margin:9px 0 14px}.narrative{white-space:pre-line;color:#34443a}.choices{display:grid;gap:9px;margin-top:24px}.choice{border:1px solid #d1d8ce;background:#fffdf8;text-align:left;padding:13px 14px;border-radius:4px;color:var(--ink)}.choice:hover{background:#f1f8e8;border-color:var(--pitch)}.choice strong{display:block;font-size:14px}.choice small{color:var(--muted);font-size:12px}.impact{display:none;margin-top:17px;background:#edf5e7;border-left:3px solid var(--pitch);padding:10px;font-size:12px}.advance{margin-top:18px;border:0;background:var(--pitch);color:#fff;border-radius:4px;padding:11px 15px;font-weight:bold}.advance:disabled{opacity:.4}.side{display:grid;gap:17px}.side-title{font-size:13px;font-weight:bold;padding:14px 15px 10px;border-bottom:1px solid var(--line)}.stats,.market,.timeline{padding:7px 15px 14px}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0;font-size:12px}.stat b{font-size:12px}.market h4{margin:7px 0 4px;font-size:13px;color:var(--deep)}.market p{margin:0 0 8px;font-size:12px;color:var(--muted)}.market li{font-size:12px;padding:8px 0;border-bottom:1px solid #eee;list-style:none}.market ul{padding:0;margin:0}.market b{color:var(--pitch)}.time{font-size:12px;border-left:2px solid #d5dfc7;padding:0 0 13px 11px;margin-left:5px;position:relative}.time:before{content:"";width:7px;height:7px;background:var(--pitch);border-radius:50%;position:absolute;left:-4.5px;top:5px}.time b{display:block}.modal{display:none;position:fixed;inset:0;background:#082419aa;z-index:5;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{max-width:570px;width:100%;background:var(--card);border-radius:6px;padding:27px;box-shadow:0 18px 55px #0006}.modal-box h2{margin:0 0 10px;color:var(--deep)}.modal-box p{white-space:pre-line;color:#3c4c41}.modal-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:19px}.secondary{border:1px solid #8eaa9b;background:#fff;color:var(--deep);padding:10px 12px;border-radius:4px;font-weight:bold}@media(max-width:1050px){.dashboard{grid-template-columns:245px 1fr}.side{grid-column:1/-1;grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.hero{padding:48px 24px}.hero h1{font-size:33px}.grid{grid-template-columns:1fr}.span2{grid-column:auto}.dashboard{display:block;padding:12px}.dashboard>.card,.side{margin-bottom:12px}.side{display:grid;grid-template-columns:1fr;gap:12px}.story{padding:22px}.top{padding:0 14px}}
.custom{margin-top:5px;padding-top:14px;border-top:1px dashed #cbd4c7}.custom label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.custom textarea{display:block;width:100%;min-height:74px;resize:vertical;border:1px solid #bdc6be;border-radius:4px;padding:9px;font:inherit;font-size:13px;color:var(--ink);background:white}.custom button{margin-top:8px;border:1px solid #8eaa9b;background:white;color:var(--deep);padding:8px 11px;border-radius:4px;font-weight:bold}.custom button:disabled{opacity:.55}
</style>
</head>
<body>
<header class="top"><div class="brand">绿茵年表<small>CHINESE FOOTBALL CAREER SIMULATOR</small></div><button id="reset">重新开档</button></header>
<main class="screen active" id="setup"><section class="hero"><div class="eyebrow">从 16 岁开始</div><h1>让每一次选择，写进你的足球生涯。</h1><p>青训、比赛、人际关系、训练和转会窗。你会在真实的压力与机会间作出决定，直至四十岁才面对退役、执教或继续征战的选择。</p></section><section class="setup"><div class="card form-card"><h2>建立球员档案</h2><p class="hint">18 岁前总评不超过 80，身价不超过 EUR 80M。配置 Netlify API 后，赛事故事会依据你的档案动态生成。</p><form id="form"><div class="grid"><div class="field"><label>姓名</label><input name="name" required maxlength="16" placeholder="例如：林泽宇"></div><div class="field"><label>家乡地区</label><select name="region"><option>广东</option><option>山东</option><option>辽宁</option><option>上海</option><option>北京</option><option>湖北</option><option>四川</option><option>其他地区</option></select></div><div class="field"><label>身高（cm）</label><input name="height" type="number" min="155" max="205" value="178"></div><div class="field"><label>体重（kg）</label><input name="weight" type="number" min="50" max="105" value="70"></div><div class="field"><label>主要位置</label><select name="position"><option value="ST">ST 中锋</option><option value="LW">LW 左边锋</option><option value="RW">RW 右边锋</option><option value="CAM">CAM 前腰</option><option value="CM">CM 中前卫</option><option value="CDM">CDM 后腰</option><option value="CB">CB 中后卫</option><option value="LB">LB 左后卫</option><option value="RB">RB 右后卫</option><option value="GK">GK 门将</option></select></div><div class="field"><label>惯用脚</label><select name="foot"><option>右脚</option><option>左脚</option></select></div><div class="field span2"><label>青训地点</label><select name="academy"><option value="广州足球学校">广州足球学校 - 强竞争、技术与身体基础</option><option value="山东泰山U17">山东泰山青训 - 成熟梯队、对抗与纪律</option><option value="上海海港U17">上海海港青训 - 国际视野、传控体系</option><option value="大连青训中心">大连青训 - 北方硬朗风格、比赛机会</option><option value="成都蓉城U17">成都蓉城青训 - 新兴体系、耐心培养</option></select></div></div><button class="primary">踏上职业道路</button></form></div></section></main>
<main class="screen" id="game"><div class="dashboard"><aside class="card profile"><div class="profile-head"><div class="club" id="club"></div><div class="pname" id="pname"></div><div class="bio" id="bio"></div><div class="ovr-row"><div class="ovr" id="ovr"></div><div class="ovr-label">总评 OVR<br><span id="potential"></span></div></div></div><div class="profile-body"><div class="value">市场身价<b id="value"></b></div><div id="attrs"></div><details><summary>展开详细属性</summary><div class="detail" id="detail"></div></details></div></aside><section class="card"><div class="season-head"><div><div class="club" id="season"></div><h2 id="phase"></h2><p id="league"></p></div><div class="tag" id="age"></div></div><article class="story"><div class="chapter" id="chapter"></div><h3 id="title"></h3><div class="narrative" id="text"></div><div class="choices" id="choices"></div><div class="impact" id="impact"></div><button class="advance" id="advance" disabled>进入下一段赛季</button></article></section><aside class="side"><section class="card"><div class="side-title">本赛季记录</div><div class="stats" id="stats"></div></section><section class="card"><div class="side-title">转会市场脉动</div><div class="market"><h4 id="market-title"></h4><p id="market-note"></p><ul id="market"></ul></div></section><section class="card"><div class="side-title">生涯时间线</div><div class="timeline" id="timeline"></div></section></aside></div></main><div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<script>
const $=id=>document.getElementById(id),keys=["PAC","SHO","PAS","DRI","DEF","PHY"],labels={PAC:"PAC 速度",SHO:"SHO 射门",PAS:"PAS 传球",DRI:"DRI 盘带",DEF:"DEF 防守",PHY:"PHY 身体"};let s;
const base={ST:{PAC:61,SHO:61,PAS:53,DRI:57,DEF:36,PHY:59},LW:{PAC:64,SHO:56,PAS:56,DRI:62,DEF:38,PHY:52},RW:{PAC:64,SHO:56,PAS:56,DRI:62,DEF:38,PHY:52},CAM:{PAC:58,SHO:56,PAS:63,DRI:61,DEF:42,PHY:52},CM:{PAC:57,SHO:54,PAS:63,DRI:57,DEF:52,PHY:55},CDM:{PAC:55,SHO:44,PAS:58,DRI:52,DEF:62,PHY:62},CB:{PAC:55,SHO:35,PAS:48,DRI:46,DEF:65,PHY:67},LB:{PAC:62,SHO:43,PAS:55,DRI:54,DEF:58,PHY:59},RB:{PAC:62,SHO:43,PAS:55,DRI:54,DEF:58,PHY:59},GK:{PAC:46,SHO:20,PAS:50,DRI:39,DEF:67,PHY:63}};
const weights={ST:[1,.45,.25,.25,.05,.25],LW:[.35,.2,.15,.25,.05,.1],RW:[.35,.2,.15,.25,.05,.1],CAM:[.12,.14,.32,.28,.05,.09],CM:[.1,.1,.3,.18,.18,.14],CDM:[.08,.04,.18,.1,.36,.24],CB:[.1,.02,.1,.06,.42,.3],LB:[.2,.04,.16,.12,.28,.2],RB:[.2,.04,.16,.12,.28,.2],GK:[.03,.01,.12,.02,.58,.24]};
function ovr(){let w=weights[s.position];return Math.round(keys.reduce((n,k,i)=>n+s.a[k]*w[i],0))}function money(){let f=s.age<20?.35+(s.age-16)*.1625:s.age>30?Math.max(.18,1-(s.age-30)*.105):1,v=Math.max(150000,Math.pow(Math.max(0,ovr()-45),2.4)*12000*f*(1+s.rep/220));return Math.min(s.age<18?80000000:Infinity,Math.round(v/10000)*10000)}function eur(n){return n>=1e6?"EUR "+(n/1e6).toFixed(1)+"M":"EUR "+Math.round(n/1000)+"K"}function season(){return s.year+"-"+String(s.year+1).slice(-2)+" 赛季"}function save(){localStorage.setItem("greenChronicle",JSON.stringify(s))}
function render(){let r=s.coach?s.coachRate:ovr();$("club").textContent=s.coach?s.coachClub:s.club;$("pname").textContent=s.name;$("bio").textContent=s.coach?"主教练 | 从球场走向战术板":`${s.position} | ${s.height}cm / ${s.weight}kg | ${s.foot}`;$("ovr").textContent=r;$("potential").textContent=s.coach?"执教评级":"潜力 "+Math.max(80,Math.min(94,r+8));$("value").textContent=s.coach?"战术声望 "+s.rep:eur(money());$("season").textContent=s.coach?season()+" 教练赛季":season();$("league").textContent=s.coach?s.coachClub+" | 主教练":s.club+" | "+s.league;$("age").textContent=s.coach?"执教第 "+s.coachYear+" 年":s.age+" 岁";$("attrs").innerHTML=keys.map(k=>`<div class="attr"><div class="attr-title"><span>${labels[k]}</span><b>${s.a[k]}</b></div><div class="bar"><i style="width:${s.a[k]}%"></i></div></div>`).join("");$("detail").innerHTML=keys.map(k=>["加速 / 反应","射术 / 站位","视野 / 短传","敏捷 / 控球","意识 / 抢断","力量 / 耐力"].map((n,i)=>`<div><span>${n}</span><b>${Math.max(25,s.a[k]+(i%3-1)*2)}</b></div>`).join("")).join("");let st=s.coach?[["执教评级",s.coachRate],["声望",s.rep],["执教年份",s.coachYear],["球队",s.coachClub]]:[["出场",s.stats.app],["进球",s.stats.goal],["助攻",s.stats.ast],["体能",s.fit+"%"]];$("stats").innerHTML=st.map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");$("market-title").textContent=s.coach?"教练市场":"全球转会市场";$("market-note").textContent=s.coach?"董事会与更衣室都在观察你的答案。":"真实球星的去向会影响联赛格局。";$("market").innerHTML=[["姆巴佩","皇家马德里","阵容持续调整"],["维尔茨","勒沃库森","欧洲豪门持续关注"],["武磊","上海海港","合同与未来受到讨论"]].map(x=>`<li><b>${x[0]}</b> → ${x[1]}<br><span>${x[2]}</span></li>`).join("");$("timeline").innerHTML=s.log.slice(-5).reverse().map(x=>`<div class="time"><b>${x.y}</b>${x.t}</div>`).join("")}
function events(){return[{c:"季前 | 选择一",p:"薄雾里的第一堂合练",t:`清晨六点，${s.club}的草地还挂着露水。教练把训练分成两组，你被安排在强度更高的一侧。有人说，这一周的态度会决定青年联赛首轮名单。\n\n身体还没有完全醒来，但你知道这是第一个不会被镜头记录的岔路口。`,q:[["留下加练半小时","提高耐力与技术，但疲劳积累。",{PHY:1,DRI:1},1,0,-4],["按计划结束，做好恢复","保持健康，把精力留给周末。",{PHY:1},0,0,3],["请求一线队体能师加训","有机会被记住，也可能急于求成。",{PAC:2},0,2,-5]]},{c:"联赛 | 选择二",p:"六码区外的一次停球",t:`青年联赛首轮第七十三分钟，比分 1:1。直塞球从两名后卫之间穿过，你在禁区边缘接到球。门将正在出击，边路的队友举手要球。\n\n脚下这一下，会成为赛后所有人反复提起的画面。`,q:[["冷静推射远角","相信自己完成终结。",{SHO:2},0,2,0],["横传给空位队友","选择成功率更高的答案。",{PAS:2,DRI:1},0,1,0],["扣过后卫再起脚","高风险的个人处理。",{DRI:2,PAC:1},1,0,-2]]},{c:"更衣室 | 选择三",p:"一张没有署名的战术纸",t:`连续两场替补后，一位主力队友把战术板丢在长椅上，语气并不客气。晚些时候，助教在走廊里停下脚步，问你是否愿意留下来一起看录像。\n\n这里没有摄像机，只有未来几个月你在队内被如何看待。`,q:[["留下看录像，提出观察","提升比赛理解，建立教练信任。",{PAS:2,DEF:1},0,2,0],["私下和主力队友沟通","化解摩擦，换来更衣室支持。",{PHY:1},0,3,0],["把情绪留在场上","专注训练，用表现回应。",{PAC:1,SHO:1},2,-1,0]]},{c:"冬窗 | 转会选择",p:"经纪人的深夜电话",t:`十二月的训练基地亮着最后一盏灯。经纪人打来电话：几家俱乐部注意到了你。没有谁能保证首发，但每一份报价都意味着不同的路。\n\n电话那头安静地等你的回答。`,q:[["转会至更高平台","高强度比赛，首发位置需重新争取。",{DRI:1,PAS:1},1,3,-1,"上海海港B队"],["留在当前俱乐部","熟悉的环境，等待更明确的位置。",{PAS:1,DRI:1},0,1,2],["接受海外试训","陌生体系带来更大的风险与上限。",{PAC:1,SHO:1},1,3,-3,"格罗宁根" ]]},{c:"冲刺 | 选择五",p:"一场必须被记住的比赛",t:`联赛进入尾声，${s.club}需要积分，而你也需要证明自己。队医提醒你右腿的紧张感尚未完全消失。主教练没有替你做决定，只说：我需要一个清醒的球员。`,q:[["带着保护上场，踢满比赛","赢得信任，也增加伤病风险。",{PHY:1,SHO:1},0,2,-8],["申请替补，保持冲刺能力","健康优先，等待关键时刻。",{PAC:1},0,-1,4],["调整训练，专攻定位球","用另一种方式影响比赛。",{PAS:2,SHO:1},1,0,0]]}]}function show(){if(s.coach)return coachEvent();let e=events()[s.i];if(!e)return end();s.picked=false;$("chapter").textContent=e.c;$("phase").textContent=e.c.split("|")[0];$("title").textContent=e.p;$("text").textContent=e.t;drawChoices(e.q.map(x=>({t:x[0],d:x[1],effect:x[2],form:x[3],rep:x[4],fit:x[5],club:x[6]})));render();ai(e)}function drawChoices(q){$("choices").innerHTML=q.map((x,i)=>`<button class="choice" data-i="${i}"><strong>${x.t}</strong><small>${x.d}</small></button>`).join("");$("impact").style.display="none";$("advance").disabled=true;document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(q[+b.dataset.i]))}function choose(q){if(s.picked)return;s.picked=true;for(let k in q.effect)s.a[k]=Math.min(99,Math.max(25,s.a[k]+q.effect[k]));s.rep=Math.max(0,Math.min(100,s.rep+q.rep));s.fit=Math.max(45,Math.min(100,s.fit+q.fit));if(q.club){s.log.push({y:s.year,t:`从${s.club}转会至${q.club}`});s.club=q.club;s.league=q.club==="格罗宁根"?"荷甲":"中乙"}s.stats.app+=3;s.stats.goal+=Math.max(0,Math.round((s.a.SHO-50)/15));s.stats.ast+=Math.max(0,Math.round((s.a.PAS-50)/18));$("impact").textContent="这次选择留下了痕迹："+Object.entries(q.effect).map(x=>labels[x[0]]+" +"+x[1]).join("，")+"。";$("impact").style.display="block";$("advance").disabled=false;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);save();render()}function end(){keys.forEach(k=>{let g=s.age<22?1.4:s.age<29?.5:s.age<33?.1:-.45;if(s.age>=33&&["PAC","PHY"].includes(k))g-=.65;s.a[k]=Math.max(28,Math.min(99,Math.round(s.a[k]+g)))});s.log.push({y:s.year+"/"+(s.year+1),t:`${s.club} | ${s.stats.app} 场 ${s.stats.goal} 球 ${s.stats.ast} 助`});if(ovr()>=77&&s.stats.goal+s.stats.ast>7)s.honors.push(s.league+"最佳阵容");if(s.age===40){save();retirement();return}s.year++;s.age++;s.i=0;s.stats={app:0,goal:0,ast:0};s.fit=Math.min(96,s.fit+10);save();modal("赛季落幕",`新的赛季会更快，也会更重。${s.age} 岁的你，总评来到 ${ovr()}。`,[{t:"继续",f:()=>{close();show()}}]);render()}
async function ai(e){if(location.protocol==="file:"||s.i===3)return;let stamp=s.year+"/"+s.i;try{let r=await fetch("/.netlify/functions/career-event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:s.name,age:s.age,position:s.position,club:s.club,league:s.league,attributes:s.a,ovr:ovr(),marketValue:eur(money()),recentHistory:s.log.slice(-3),eventSeed:{title:e.p,text:e.t}})});if(!r.ok)return;let d=await r.json();if(s.picked||stamp!==s.year+"/"+s.i||!d.title||!d.choices)return;$("title").textContent=d.title;$("text").textContent=d.text;drawChoices(d.choices)}catch(_){}}

$("form").onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),a={...base[f.position]};s={...f,height:+f.height,weight:+f.weight,club:f.academy,league:"全国青少年联赛",age:16,year:2023,a,rep:8,fit:82,i:0,picked:false,stats:{app:0,goal:0,ast:0},log:[{y:"2023",t:"进入"+f.academy+"，职业故事开始"}],honors:[],coach:false,coachRate:60,coachYear:0,coachClub:""};save();$("setup").classList.remove("active");$("game").classList.add("active");show()};$("advance").onclick=()=>{if(s.coach){s.coachYear++;s.year++;save();coachEvent()}else{s.i++;save();show()}};$("reset").onclick=()=>{if(confirm("确定清除当前生涯？")){localStorage.removeItem("greenChronicle");location.reload()}};try{s=JSON.parse(localStorage.getItem("greenChronicle"));if(s){$("setup").classList.remove("active");$("game").classList.add("active");show()}}catch(_){localStorage.removeItem("greenChronicle")}
async function customChoice(){if(s.coach){$("impact").textContent="教练生涯的自定义决策将在后续事件中开放。";$("impact").style.display="block";return}let input=$("custom-choice"),choice=input.value.trim();if(!choice)return;if(location.protocol==="file:"){$("impact").textContent="自定义选择需要部署到 Netlify 并配置 DeepSeek API Key 后才能由 AI 判定。";$("impact").style.display="block";return}let button=$("custom-submit");button.disabled=true;button.textContent="AI 正在判断...";try{let r=await fetch("/.netlify/functions/career-event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"custom",name:s.name,age:s.age,position:s.position,club:s.club,league:s.league,attributes:s.a,ovr:ovr(),marketValue:eur(money()),recentHistory:s.log.slice(-3),eventSeed:{title:$("title").textContent,text:$("text").textContent},customChoice:choice})});if(!r.ok)throw new Error("AI request failed");let q=await r.json();if(!q||!q.effect)throw new Error("Invalid AI assessment");q.t="自定义选择："+choice;q.d=q.outcome||"AI 已结合你的当前处境评估此选择。";choose(q)}catch(_){$("impact").textContent="AI 暂时无法判定该选择，请稍后重试。";$("impact").style.display="block";button.disabled=false;button.textContent="让 AI 判断影响"}}
function drawChoices(q,allowCustom=true){$("choices").innerHTML=q.map((x,i)=>`<button class="choice" data-i="${i}"><strong>${x.t}</strong><small>${x.d}</small></button>`).join("")+(allowCustom?`<div class="custom"><label for="custom-choice">其他选择</label><textarea id="custom-choice" maxlength="280" placeholder="写下你希望采取的处理方式"></textarea><button type="button" id="custom-submit">让 AI 判断影响</button></div>`:"");$("impact").style.display="none";$("advance").disabled=true;document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(q[+b.dataset.i]));if(allowCustom)$("custom-submit").onclick=customChoice}
function choose(q){if(s.picked)return;s.picked=true;let safeEffect={};for(let k in (q.effect||{})){if(keys.includes(k)&&Number.isFinite(q.effect[k])){let n=Math.max(-2,Math.min(3,q.effect[k]));safeEffect[k]=n;s.a[k]=Math.min(99,Math.max(25,s.a[k]+n))}}s.rep=Math.max(0,Math.min(100,s.rep+Math.max(-3,Math.min(4,q.rep||0))));s.fit=Math.max(45,Math.min(100,s.fit+Math.max(-8,Math.min(5,q.fit||0))));if(q.club){s.log.push({y:s.year,t:`从${s.club}转会至${q.club}`});s.club=q.club;s.league=q.club==="格罗宁根"?"荷甲":"中乙"}s.stats.app+=3;s.stats.goal+=Math.max(0,Math.round((s.a.SHO-50)/15));s.stats.ast+=Math.max(0,Math.round((s.a.PAS-50)/18));let strongest=Object.entries(safeEffect).sort((a,b)=>b[1]-a[1])[0];if(strongest){ensureIdentity();s.identity.growth=labels[strongest[0]]+"导向"}let delta=Object.entries(safeEffect).map(x=>labels[x[0]]+" "+(x[1]>=0?"+":"")+x[1]).join("，");$("impact").textContent=q.outcome||("这次选择留下了痕迹："+(delta||"声望与状态发生变化")+"。");$("impact").style.display="block";$("advance").disabled=false;document.querySelectorAll(".choice,.custom button,.custom textarea").forEach(b=>b.disabled=true);save();render()}

{c:"第三幕 | 雨战",p:"泥水里的最后七分钟",t:`客场的雨像倾倒下来一样。第八十三分钟，球衣早已沾满泥，比分却还停在僵持的位置。一次解围落在你脚边，身后有人贴上来，前方只有一条被雨水切开的通道。\n\n看台上的嘘声忽远忽近。你忽然想起离开家前家人说过的话：跑不动的时候，就看看自己为什么开始。`,q:[["带球向前，硬闯防线","把比赛拖进身体与意志的对抗。",{PAC:1,DRI:1,PHY:1},2,1,-4],["一脚转移到弱侧","在混乱中相信队友的空位。",{PAS:2},0,2,0],["制造定位球机会","接受不完美，争取最有把握的一击。",{SHO:1,PHY:1},0,1,-1],["护球拖慢节奏","守住来之不易的一分，也承受保守的质疑。",{DEF:1,PHY:1},0,-1,1]]},
{c:"冬窗 | 分岔",p:"经纪人的深夜电话",t:`冬夜的训练基地只剩下器材室还亮着灯。经纪人的电话在掌心震动，他说有俱乐部愿意为你留一个位置，但没有人能替你保证首发。\n\n窗外的雨敲着玻璃。留在熟悉的地方，或走向一块陌生的草皮，答案都不会写在合同上。`,q:[["转会至上海海港B队","更快的节奏与更高的门槛，等着你重新证明自己。",{DRI:1,PAS:1},1,3,-1,"上海海港B队"],["留在当前俱乐部","熟悉的体系能给你时间，也可能让舒适变成惯性。",{PAS:1,DRI:1},0,1,2],["接受格罗宁根试训","把自己放进陌生语言与陌生对抗中，赌一次更远的可能。",{PAC:1,SHO:1},1,3,-3,"格罗宁根"],["争取租借到青岛西海岸","带着出场条款走进真正有升降级压力的环境。",{PHY:1,DEF:1},0,2,-1,"青岛西海岸"]]},
{c:"第四幕 | 裂缝",p:"队医没有立刻给出答案",t:`一次冲刺后，你的腿后侧像被火划过。队医让你坐下，沉默地按压那块发紧的肌肉。下一轮恰好是关键战，主教练只问了一句：你能不能对自己的身体诚实？\n\n走廊尽头传来队友庆祝训练结束的声音。你第一次清楚地感到，勇敢和逞强之间只隔着一条很细的线。`,q:[["坚持完成完整合练","用意志顶住疼痛，争取留在名单里。",{PHY:1,SHO:1},0,2,-7],["接受恢复计划，放弃这一轮","暂时离开聚光灯，换一副能跑更远的身体。",{PAC:1},0,-1,5],["与教练商量限定出场时间","不逃避比赛，也不把风险交给运气。",{DRI:1,PHY:1},0,1,2],["转练上肢与比赛阅读","把不能奔跑的日子变成另一种积累。",{PAS:2,DEF:1},1,0,3]]},
{c:"第五幕 | 更衣室",p:"没有署名的战术纸",t:`连续两场没有首发，一张战术纸被人丢在长椅上。上面圈出的，恰好是你在比赛里没有覆盖到的区域。有人笑了一声，也有人把目光移开。\n\n晚些时候，助教在录像室门口等你。他没有替你说话，只把遥控器递过来：你来告诉我，这一球为什么会丢。`,q:[["留下逐帧分析录像","把尴尬拆成具体的跑位与判断。",{PAS:2,DEF:1},0,2,0],["私下找队长沟通","先听清更衣室真正的声音。",{PHY:1},0,3,0],["训练中用表现回应","让每一次对抗都比争辩更有分量。",{PAC:1,SHO:1},2,-1,-1],["承认问题并请求额外指导","把自尊放到一边，换来更清晰的成长路径。",{DRI:1,DEF:2},0,2,-2]]},
{c:"第六幕 | 杯赛夜",p:"灯光照亮了没有退路的禁区",t:`杯赛淘汰赛的夜晚，草皮被灯光切得格外清晰。第六十五分钟，你的球队少一人作战，所有人都知道下一次失误可能就是赛季的终点。\n\n替补席安静得只剩下呼吸。教练在场边做出手势，你忽然发现自己不再害怕那份被交到手里的责任。`,q:[["主动回撤，补上防守空当","把个人数据留在身后，先让球队活下去。",{DEF:2,PHY:1},0,2,-3],["持续冲击身后的空档","用速度逼迫对手也不敢全部压上。",{PAC:2,DRI:1},2,1,-4],["把每次机会交给最稳的队友","在高压里保持最简单的足球。",{PAS:2},0,2,-1],["承担关键定位球","让全场目光落在自己的助跑上。",{SHO:2,PAS:1},1,3,-2]]},
{c:"终章 | 终场前",p:"你必须成为那个站出来的人",t:`赛季最后一轮，积分榜像一根绷到极限的弦。看台上有人举着你的号码，也有人等着看你在压力下失去什么。\n\n进入补时，比分依然没有答案。你抬头看见队友正在跑动，远处的球门像整整一年所有清晨、雨战与沉默的总和。`,q:[["要求队友把球交给自己","承担最后一击，也承担可能的遗憾。",{SHO:2,DRI:1},2,3,-3],["发动最后一次团队配合","让最合理的跑位决定结局。",{PAS:2,DRI:1},1,2,-2],["先完成防守再反击","不被热血冲昏，守住通向未来的底线。",{DEF:2,PHY:1},0,1,-1],["赛后留下来向球迷致意","把结果之外的连接留在这个夜晚。",{PHY:1},0,3,-2]]}
]}
const identityStyle=document.createElement("style");identityStyle.textContent="#identity{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}#identity h4{font-size:12px;margin:0 0 8px;color:var(--deep)}#identity p{font-size:11px;margin:4px 0;color:var(--muted)}#identity b{color:var(--ink)}";document.head.appendChild(identityStyle);
function ensureIdentity(){if(!s||s.identity)return;let map={ST:["禁区猎手","抢点与冷静终结",3,3],LW:["爆点边锋","快速带球",4,3],RW:["爆点边锋","快速带球",4,3],CAM:["自由创造者","直塞与远射",3,3],CM:["中场节拍器","长传调度",3,3],CDM:["攻防枢纽","预判拦截",2,3],CB:["后防磐石","预判拦截",2,3],LB:["往返边卫","传中",3,3],RB:["往返边卫","传中",3,3],GK:["门线守护者","扑救反应",1,3]}[s.position]||["全能球员","斗士",2,3];s.identity={archetype:map[0],playstyle:map[1],skills:map[2],weakFoot:map[3],growth:"尚未定义"};save()}
const baseRender=render;render=function(){baseRender();if(!s)return;ensureIdentity();let box=$("identity");if(!box){box=document.createElement("section");box.id="identity";box.className="identity";document.querySelector(".profile-body").appendChild(box)}box.innerHTML=`<h4>球员身份</h4><p><b>${s.identity.archetype}</b> | ${s.identity.playstyle}</p><p>花式 ${s.identity.skills} 星 · 逆足 ${s.identity.weakFoot} 星</p><p>成长印象：${s.identity.growth}</p>`}
ai=async function(e){if(location.protocol==="file:"||s.i===3)return;ensureIdentity();let stamp=s.year+"/"+s.i;try{let r=await fetch("/.netlify/functions/career-event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:s.name,age:s.age,height:s.height,weight:s.weight,position:s.position,foot:s.foot,identity:s.identity,club:s.club,league:s.league,attributes:s.a,ovr:ovr(),marketValue:eur(money()),recentHistory:s.log.slice(-3),eventSeed:{title:e.p,text:e.t}})});if(!r.ok)return;let d=await r.json();if(s.picked||stamp!==s.year+"/"+s.i||!d.title||!d.choices)return;$("title").textContent=d.title;$("text").textContent=d.text;drawChoices(d.choices)}catch(_){}}
if(s)render();
